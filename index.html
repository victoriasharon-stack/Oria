<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oria</title>
  </head>
  <body>
    <header>
      <h1>Oria</h1>
      <p class="disclaimer">
        Research prototype, not a medical device. Use public dataset images only,
        never real patient scans. This tool never determines fetal sex.
      </p>
    </header>

    <main>
      <div class="controls">
        <input type="file" id="file" accept="image/*" />
        <label>
          Gamma
          <input type="range" id="gamma" min="0.4" max="2.5" step="0.05" value="1" />
        </label>
      </div>

      <div class="viewer">
        <figure>
          <canvas id="original"></canvas>
          <figcaption>Original</figcaption>
        </figure>
        <figure>
          <canvas id="enhanced"></canvas>
          <figcaption>Enhanced</figcaption>
        </figure>
      </div>

      <section id="analysis">
        <h2>Analysis</h2>
        <p id="analysis-output">Classifier not implemented yet.</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
